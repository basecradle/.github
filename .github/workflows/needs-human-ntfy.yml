name: Needs-Human ntfy Alert

on:
  workflow_call:
    secrets:
      NTFY_TOKEN:
        description: ntfy.sh access token used to publish to the fleet topic
        required: true

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Publish to ntfy
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          # The token never rides curl's argv (visible to every reader of the process table for the
          # call's lifetime) and never prints under a traced shell: xtrace off first, then the headers
          # go to curl through `--config -` on stdin and the body through a 0600 file (basecradle#774,
          # the shape basecradle-noc#1310 gave the heartbeat URL).
          set +x
          umask 077
          printf '%s\n#%s %s' "$REPO" "$ISSUE_NUMBER" "$ISSUE_TITLE" > ntfy-body.txt
          curl -sf --retry 3 --max-time 15 --config - https://ntfy.sh/BaseCradle-GitHub <<CURLCFG
          header = "Authorization: Bearer $NTFY_TOKEN"
          header = "Title: GitHub Needs Human"
          header = "Priority: 5"
          header = "Tags: rotating_light"
          header = "Click: $ISSUE_URL"
          data-binary = "@ntfy-body.txt"
          CURLCFG
          rm -f ntfy-body.txt
