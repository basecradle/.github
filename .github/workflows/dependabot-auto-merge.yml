name: Dependabot Auto-Merge

on:
  workflow_call: {}

permissions: {}

jobs:
  route:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # Both third-party actions below are pinned to a full commit SHA, never a
      # tag: this job holds the capital's App key on every Dependabot pull request
      # in the fleet, and a tag is a ref its owner can move (basecradle#869). A
      # bump here is read by the capital before it merges; this repository has no
      # auto-merge.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The merge must ride an App token, never GITHUB_TOKEN: GitHub suppresses
      # workflow triggers on pushes made by GITHUB_TOKEN (recursion guard), so a
      # GITHUB_TOKEN-armed auto-merge lands on main with NO main CI run and NO
      # deploy — every [kamal deploy] token on a stub-merged bump was silently
      # stranded (basecradle#486). Minting requires the org secrets
      # BASECRADLE_AI_CLIENT_ID / BASECRADLE_AI_APP_PRIVATE_KEY reaching this
      # workflow via `secrets: inherit` on the stub's `uses:` call — AND, because
      # Dependabot-triggered runs read ONLY the org DEPENDABOT secrets store
      # (never the Actions store), both secrets must exist there too; a key
      # rotation must update BOTH stores. A stub not yet re-synced with the
      # inherit line, or a store missing a secret, fails here, loudly — merges
      # wait, nothing strands.
      # WHOSE TOKEN (basecradle#870): the calling repository's OWN bot. Every repository
      # sets FLEET_BOT_CLIENT_ID and FLEET_BOT_APP_PRIVATE_KEY (Actions AND Dependabot
      # stores) to its captain's App; the capital's two repositories set the capital's.
      # So the merge is armed by the App that may update that repository's main, and the
      # capital's key is needed in no builder repository. The `|| secrets.BASECRADLE_AI_*`
      # fallback is a bridge for a repository whose FLEET_BOT_* pair is not placed yet;
      # it is removed in the same change that deletes the organization-level copies.
      - name: Mint this repository's bot token
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.FLEET_BOT_CLIENT_ID || secrets.BASECRADLE_AI_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_BOT_APP_PRIVATE_KEY || secrets.BASECRADLE_AI_APP_PRIVATE_KEY }}

      # Fail-closed: auto-merge ONLY on an explicit patch or minor verdict. A
      # major, a null/empty update-type (fetch-metadata has had ecosystems
      # resolve null), or any future value routes to the capital instead.
      - name: Enable auto-merge for patch and minor updates
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      # Label ONLY on `opened`, matching the comment step below — the two are one
      # atomic pair (every routing-label application rides its comment; shared law,
      # Cross-Repo Handoffs live-protocol items 7-9). Without this gate a Dependabot
      # rebase (`synchronize`) re-applied the label BARE and silently overrode a
      # capital clearing (basecradle-harness#363, caught by the noc#401 guard).
      - name: Label non-patch/minor updates for capital routing
        if: "!contains(fromJSON('[\"version-update:semver-patch\", \"version-update:semver-minor\"]'), steps.metadata.outputs.update-type) && github.event.action == 'opened'"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label needs-capital

      - name: Comment on non-patch/minor updates
        if: "!contains(fromJSON('[\"version-update:semver-patch\", \"version-update:semver-minor\"]'), steps.metadata.outputs.update-type) && github.event.action == 'opened'"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >
          gh pr comment "$PR_URL" --body
          "Not auto-merged: the update-type is not an explicit patch or minor
          (major, or unresolved metadata). Labeled \`needs-capital\`; the
          capital routes this one."
