name: Dependabot Auto-Merge

on:
  workflow_call: {}

permissions: {}

jobs:
  route:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # Both third-party actions below are pinned to a full commit SHA, never a
      # tag: this job holds the calling repository's bot key on every Dependabot
      # pull request in the fleet, and a tag is a ref its owner can move (basecradle#869). A
      # bump here is read by the capital before it merges; this repository has no
      # auto-merge.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The merge must ride an App token, never GITHUB_TOKEN: GitHub suppresses
      # workflow triggers on pushes made by GITHUB_TOKEN (recursion guard), so a
      # GITHUB_TOKEN-armed auto-merge lands on main with NO main CI run and NO
      # deploy — every [kamal deploy] token on a stub-merged bump was silently
      # stranded (basecradle#486). Minting requires the calling repository's own
      # FLEET_BOT_CLIENT_ID / FLEET_BOT_APP_PRIVATE_KEY reaching this workflow via
      # `secrets: inherit` on the stub's `uses:` call. They are REPOSITORY secrets
      # (no organization copy exists: basecradle#870), and because
      # Dependabot-triggered runs read ONLY a repository's DEPENDABOT secrets
      # store (never its Actions store), the pair must be in both; a key rotation
      # updates both stores of that one repository.
      # ONE VERDICT, read by every step below. Auto-merge needs BOTH: an explicit patch
      # or minor update-type (fail-closed, as before: a major, a null or any future value
      # routes to the capital), AND that the update is not on a publish path. A publish-path
      # update moves an action (which runs in jobs that hold a credential), or a build tool its
      # repository names: CI never exercises a publish job or a credential-holding step, so a
      # green CI says nothing about it (basecradle#874, @origin 2026-11-16).
      # It is read by the capital instead. EVERY repository (@origin, 2026-11-22, after a
      # week's trial on one): no list of repositories, so a new repository is covered the day
      # it carries the stub. The values are compared as data, never evaluated.
      - name: "Decide: merge automatically, or route to the capital"
        id: verdict
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
        run: |
          set -euo pipefail
          auto=false
          reason="the update-type is not an explicit patch or minor (major, or unresolved metadata)"
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) auto=true; reason="" ;;
          esac
          on_publish_path=false
          case "$ECOSYSTEM" in
            github_actions|github-actions) on_publish_path=true ;;
          esac
          # The repository says what else is on its publish path: a Dependabot group named
          # `publish-path` in its own dependabot.yml (its build tools and their closure).
          # The policy lives here, the list lives with the repository that knows it.
          if [ "$DEPENDENCY_GROUP" = "publish-path" ]; then on_publish_path=true; fi
          if [ "$on_publish_path" = true ]; then
            auto=false
            reason="it moves an action, or a build tool on this repository's publish path, which CI does not exercise"
          fi
          echo "auto=$auto" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "verdict: auto=$auto ecosystem=$ECOSYSTEM update-type=$UPDATE_TYPE ${reason:+($reason)}"

      # WHOSE TOKEN (basecradle#870): the calling repository's OWN bot. Every repository
      # sets FLEET_BOT_CLIENT_ID and FLEET_BOT_APP_PRIVATE_KEY (Actions AND Dependabot
      # stores) to its captain's App; the capital's two repositories set the capital's.
      # So the merge is armed by the App that may update that repository's main, and the
      # capital's key is needed in no builder repository. A repository without the pair
      # fails here, loudly: merges wait, nothing strands.
      - name: Mint this repository's bot token
        if: steps.verdict.outputs.auto == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.FLEET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_BOT_APP_PRIVATE_KEY }}

      # Fail-closed: auto-merge ONLY on an explicit patch or minor verdict. A
      # major, a null/empty update-type (fetch-metadata has had ecosystems
      # resolve null), or any future value routes to the capital instead.
      - name: Enable auto-merge
        if: steps.verdict.outputs.auto == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      # Label ONLY on `opened`, matching the comment step below — the two are one
      # atomic pair (every routing-label application rides its comment; shared law,
      # Cross-Repo Handoffs live-protocol items 7-9). Without this gate a Dependabot
      # rebase (`synchronize`) re-applied the label BARE and silently overrode a
      # capital clearing (basecradle-harness#363, caught by the noc#401 guard).
      - name: Label what is not auto-merged for capital routing
        if: steps.verdict.outputs.auto != 'true' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label needs-capital

      - name: Comment on what is not auto-merged
        if: steps.verdict.outputs.auto != 'true' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          gh pr comment "$PR_URL" --body "Not auto-merged: $REASON. Labeled \`needs-capital\`; the capital routes this one."
